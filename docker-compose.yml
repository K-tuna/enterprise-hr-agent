services:
  # HR 데이터베이스 (MySQL)
  db:
    image: mysql:8.0
    container_name: hr_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: enterprise_hr_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/db_init:/docker-entrypoint-initdb.d
    networks:
      - agent_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    mem_limit: 256m
    mem_reservation: 200m

  # FastAPI 애플리케이션
  api:
    build: .
    container_name: hr_api_container
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=mysql+pymysql://user:password@db:3306/enterprise_hr_db?charset=utf8mb4
      - OPENSEARCH_URL=http://opensearch:9200
      - RAG_RETRIEVER_TYPE=opensearch
      - RAG_EMBEDDING_PROVIDER=huggingface
    volumes:
      - ./app:/app/app
      - ./core:/app/core
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - agent_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    mem_limit: 350m
    mem_reservation: 300m

  # OpenSearch (Hybrid Search)
  opensearch:
    build:
      context: ./docker/opensearch
      dockerfile: Dockerfile
    image: hr-opensearch:3.5.0
    container_name: hr_opensearch_container
    restart: always
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - agent_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 512m
    mem_reservation: 256m

  # Streamlit 프론트엔드
  streamlit:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hr-streamlit:latest
    container_name: hr_streamlit_container
    restart: always
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=enterprise_hr_db
    volumes:
      - ./frontend:/app/frontend
      - ./core:/app/core
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - agent_net
    mem_limit: 200m
    mem_reservation: 150m

networks:
  agent_net:
    driver: bridge

volumes:
  mysql_data:
  opensearch_data:
